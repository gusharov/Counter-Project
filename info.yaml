# Tiny Tapeout project information
project:
  title:        "Counter"      # Project title
  author:       "Gregory Usharov"      # Your name
  discord:      "gusharov"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Counts up to 8 bits from a load"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 3x4 or 4x4

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_example"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "Load data bit 0 (LSB)"
  ui[1]: "Load data bit 1"
  ui[2]: "Load data bit 2"
  ui[3]: "Load data bit 3"
  ui[4]: "Load data bit 4"
  ui[5]: "Load data bit 5"
  ui[6]: "Load data bit 6"
  ui[7]: "Load data bit 7 (MSB)"

  # Outputs
  uo[0]: "Count output bit 0 (LSB)"
  uo[1]: "Count output bit 1"
  uo[2]: "Count output bit 2"
  uo[3]: "Count output bit 3"
  uo[4]: "Count output bit 4"
  uo[5]: "Count output bit 5"
  uo[6]: "Count output bit 6"
  uo[7]: "Count output bit 7 (MSB)"

  # Bidirectional pins
  uio[0]: "Load enable"
  uio[1]: "Output enable"
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
